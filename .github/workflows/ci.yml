name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform/build tools
        run: sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Xposed module
        run: gradle -p ngaext assembleDebug --no-daemon

      - name: Build installer
        run: gradle -p ngaext-installer assembleDebug --no-daemon

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check injected JavaScript syntax
        run: |
          node --check ngaext/app/src/main/assets/ngaext.js
          node --check ios-tweak/ngaext.js

      - name: Run JS crypto/detection tests
        run: node tests/js_core.mjs
